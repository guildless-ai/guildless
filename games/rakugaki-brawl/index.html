<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>らくがきブロウル</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2712%27 fill=%27none%27 stroke=%27%23e4572e%27 stroke-width=%274%27/%3E%3C/svg%3E" />
<style>
  :root { --bg:#f7f3e8; --ink:#222; --accent:#e4572e; --muted:#8a8378; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin:0; font-family: system-ui, "Hiragino Sans", sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; justify-content:space-between; align-items:center; padding:10px 16px; border-bottom:2px dashed #cbc3b3; }
  header h1 { font-size:20px; margin:0; }
  #status { font-size:14px; color:var(--muted); }
  main { display:grid; grid-template-columns: 1fr 1fr; gap:16px; padding:16px; max-width:1200px; margin:0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background:#fff; border:2px solid var(--ink); border-radius:12px; padding:12px; box-shadow:4px 4px 0 var(--ink); }
  canvas { display:block; width:100%; height:auto; background:#fff; border:1px solid #ddd; border-radius:8px; touch-action:none; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:8px 0; }
  button { font: inherit; padding:8px 14px; border:2px solid var(--ink); border-radius:8px; background:#fff; cursor:pointer; box-shadow:2px 2px 0 var(--ink); }
  button:active { transform: translate(2px,2px); box-shadow:none; }
  button.primary { background:var(--accent); color:#fff; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .swatch { width:28px; height:28px; border-radius:50%; border:2px solid var(--ink); cursor:pointer; }
  .swatch.active { outline:3px solid var(--accent); outline-offset:2px; }
  .meter { height:14px; background:#eee; border:1px solid var(--ink); border-radius:7px; overflow:hidden; flex:1; }
  .meter > i { display:block; height:100%; background:var(--ink); transition:width .1s; }
  .stats { font-size:13px; display:grid; grid-template-columns: repeat(5, 1fr); gap:4px; }
  .stats div { background:#f1ede2; padding:4px 6px; border-radius:6px; }
  #log { font-size:13px; max-height:120px; overflow:auto; background:#f1ede2; padding:8px; border-radius:8px; white-space:pre-line; }
  .hint { font-size:12px; color:var(--muted); }
  .hud { display:flex; justify-content:space-between; gap:12px; margin-bottom:6px; font-size:12px; }
  .hpbox { flex:1; }
  .hpbox.right { text-align:right; }
  .hp { height:10px; background:#ddd; border:1px solid var(--ink); border-radius:5px; overflow:hidden; }
  .hpbox.right .hp { direction: rtl; }
  .hp > i { display:block; height:100%; background:var(--ink); transition:width .08s; }
  .stage { position:relative; }
  .banner { position:absolute; left:0; right:0; top:28%; text-align:center; font-size:44px; font-weight:900; pointer-events:none; text-shadow: 3px 3px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff; }
  .banner.pop { animation: pop .45s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes pop { from { transform: scale(.3) rotate(-8deg); opacity:0 } to { transform: scale(1) rotate(-3deg); opacity:1 } }
  .perk { flex:1; min-width:120px; text-align:left; }
  .perk small { display:block; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>らくがきブロウル <span class="hint">prototype</span></h1>
  <div id="status"></div>
</header>
<main>
  <section>
    <div class="row">
      <strong>描く</strong>
      <span class="hint">インクは有限。何を描く？</span>
    </div>
    <canvas id="pad" width="480" height="360"></canvas>
    <div class="row">
      <span>インク</span><div class="meter"><i id="inkbar"></i></div><span id="inktext"></span>
    </div>
    <div class="row" id="palette"></div>
    <div class="row">
      <button id="undo">戻す</button>
      <button id="clear">消す</button>
      <button id="fight" class="primary">たたかう！</button>
    </div>
    <div class="stats" id="mystats"></div>
    <p class="hint">太く塗る→HP / トゲ・角→攻撃 / 軽い→素早さ / 横に長い→リーチ / 閉じた輪→盾 / 目→クリティカル / 脚→速さ / 腕→攻撃。色は相性: 赤&gt;緑&gt;青&gt;赤、黒は無属性。</p>
  </section>
  <section>
    <div class="row"><strong>バトル</strong><span id="roundinfo" class="hint"></span><span id="rendermode" class="hint"></span></div>
    <div class="hud">
      <div class="hpbox"><span id="nameA"></span><div class="hp"><i id="hpA"></i></div></div>
      <div class="hpbox right"><span id="nameB"></span><div class="hp"><i id="hpB"></i></div></div>
    </div>
    <div class="stage">
      <canvas id="arena" width="480" height="300"></canvas>
      <div id="banner" class="banner" hidden></div>
    </div>
    <div class="stats" id="enemystats"></div>
    <div id="perks" class="row" hidden></div>
    <div class="row">
      <button id="next" disabled>次のラウンド</button>
      <button id="restart">最初から</button>
    </div>
    <div id="log"></div>
    <details style="margin-top:8px">
      <summary class="hint">友だちと対戦（共有コード）</summary>
      <div class="row"><button id="copycode">今の絵のコードをコピー</button><span id="copied" class="hint"></span></div>
      <div class="row"><input id="pastecode" placeholder="相手のコードを貼る" style="flex:1;padding:6px;font:inherit" /><button id="usecode">この絵と対戦</button></div>
      <p class="hint">コードは絵そのもの。サーバ不要で、相手の落書きが次のラウンドの敵になる。</p>
    </details>
  </section>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
