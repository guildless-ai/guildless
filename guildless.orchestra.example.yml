objective: "Implement the cross-review scheduler"

agents:
  planner: 1
  builders: 3
  reviewers: 3
  breakers: 1
  fixers: 2

review_policy:
  self_review: false
  cross_review: true
  minimum_reviews_per_task: 2

verification:
  commands:
    - npm run build
    - npm test
    - npm run lint
  git_diff_check: true
  # Design-deliverables gate: the machine verifier requires these to exist.
  # design_documents:
  #   - requirements.md
  #   - architecture.md
  #   - api-spec.yaml
  #   - database-schema.md
  #   - test-plan.md
  #   - deployment.md
  #   - rollback.md
  #   - operations-runbook.md
  #   - verification_scope.md
  # design_decisions_file: design-decisions.json
  # http:
  #   - url: "https://example.com/health"
  #     status: 200
  max_fix_rounds: 2

# Optional: point agents at real LLM CLIs (e.g. `claude -p`, `codex exec`, `gemini`)
# that read --input and write --output as JSON. Defaults to the built-in demo agents.
# agent_commands:
